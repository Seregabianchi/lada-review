<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Ваш відгук — Bianchi Monitoring</title>
  <style>
    body { margin: 0; padding: 2rem; background: #1a0f07; color: #f5e6d3; font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 36rem; margin: 12vh auto; }
    a { color: #e8c48a; }
  </style>
</head>
<body>
  <main>
    <h1>Ваш відгук ☕</h1>
    <p>Відкриваємо форму відгуку…</p>
    <p><a id="continue" hidden rel="noreferrer">Якщо форма не відкрилася, натисніть тут</a></p>
    <noscript><p>Увімкніть JavaScript і відкрийте QR-код ще раз, щоб зберегти номер апарата.</p></noscript>
  </main>
  <script>
    (function () {
      'use strict';
      // Fixed destination: query parameters cannot select another host or path.
      // Preserve the original query, including source and its leading zeroes.
      var destination = 'https://bianchi-monitor.duckdns.org/review/' + window.location.search;
      var link = document.getElementById('continue');
      link.href = destination;
      link.hidden = false;
      window.location.replace(destination);
    })();
  </script>
</body>
</html>
